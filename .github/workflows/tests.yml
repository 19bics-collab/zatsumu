name: テスト

# 目的: サーバへ反映する前に、手元で pytest を流せない環境でも
# GitHub 側で必ずテストが走るようにする。
on:
  push:
    # サーバの自動更新係 (deploy/auto-update) は、追いかけるブランチの各コミットに
    # pytest の結果が付くのを待ってから反映する。PR の有無に関係なく結果が付くよう、
    # claude/ で始まるブランチへの push でも走らせる
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 は README が掲げている下限、3.12 は Dockerfile と本番の版
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
            client/requirements.txt

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: テスト
        # 画面のない環境で動くこと (client.capture は mss を関数内で読み込む)
        run: python -m pytest tests/ -q
